name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile launcher.py && bash -n start-services.sh && bash -n packaging/build-deb.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus python3-gi gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 lsof curl

      - name: Smoke test (starts the real app and quits it)
        run: xvfb-run -a packaging/smoke-test.sh

      - name: Build .deb
        id: build
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          deb="$(packaging/build-deb.sh "$VERSION")"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: siesa-dev-launcher_${{ steps.build.outputs.version }}
          path: dist/*.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.build.outputs.version }}" dist/*.deb \
            --title "Siesa Dev Launcher v${{ steps.build.outputs.version }}" \
            --notes "Build automático del commit ${GITHUB_SHA::7} en main.

          Instalar: \`sudo apt install ./siesa-dev-launcher_${{ steps.build.outputs.version }}_all.deb\`" \
            --latest
